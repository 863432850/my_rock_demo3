<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="../js/path-adapter.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碳月报及差异分析 · 报告/报表管理</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    /* ===== 碳月报及差异分析（列表页，卡片样式参考双碳管理月度简报） ===== */
    .monthly-page {
      background: #f5f7fb;
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 页签：碳排放 / 碳交易 */
    .monthly-tabs {
      display: flex;
      gap: 4px;
      background: #fff;
      border: 1px solid #eef1f4;
      border-radius: 4px;
      padding: 6px;
      width: fit-content;
    }

    .monthly-tab {
      border: none;
      background: none;
      padding: 8px 26px;
      font-size: 14px;
      color: #606266;
      border-radius: 3px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
    }

    .monthly-tab svg { width: 15px; height: 15px; }

    .monthly-tab:hover { color: var(--primary); }

    .monthly-tab.is-active {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    /* 筛选区 */
    .report-filter {
      background: #fff;
      border: 1px solid #eef1f4;
      border-radius: 4px;
      padding: 14px 16px 10px;
    }

    .report-filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px 16px;
    }

    .report-field {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .report-field > span {
      font-size: 13px;
      color: #606266;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .report-field select {
      height: 30px;
      border: 1px solid #dcdfe6;
      border-radius: 3px;
      padding: 0 8px;
      font-size: 13px;
      color: #303133;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
      width: 150px;
    }

    .report-field select:focus { border-color: var(--primary); }

    .report-filter-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    /* 月份卡片 */
    .report-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .report-card {
      background: #fff;
      border: 1px solid #9fd4ae;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-align: center;
      transition: box-shadow 0.18s, transform 0.18s, border-color 0.18s;
    }

    .report-card:hover {
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(46, 139, 87, 0.14);
      transform: translateY(-2px);
    }

    /* 未发生月份：整卡置灰（卡片标题随页签变化，便于区分） */
    .report-card.is-disabled {
      border-color: #dcdfe6;
      background: #fafbfc;
      pointer-events: none;
    }

    .report-card.is-disabled .report-card-head { background: #f2f3f5; }
    .report-card.is-disabled .report-card-month,
    .report-card.is-disabled .report-card-range { color: #c0c4cc; }
    .report-card.is-disabled .report-card-foot .report-link { color: #c0c4cc; }

    .report-card-head {
      background: #e9f7ee;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    .report-card-body {
      padding: 14px 12px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .report-card-month {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
    }

    .report-card-range {
      font-size: 11.5px;
      color: #98a1ab;
      letter-spacing: 0.2px;
    }

    /* 卡片脚：两个操作按钮 */
    .report-card-foot {
      padding: 8px 6px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px dashed #eef1f4;
    }

    .report-link {
      border: none;
      background: none;
      padding: 2px 10px;
      font-size: 13px;
      color: var(--primary);
      cursor: pointer;
      white-space: nowrap;
    }

    .report-link:hover { text-decoration: underline; }

    .report-card-foot .foot-divider {
      width: 1px;
      height: 13px;
      background: #e4e7ed;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>
    <div class="app-body">
      <aside class="app-sidebar">
        <nav class="sidebar-menu" id="sidebar-menu"></nav>
      </aside>
      <main class="app-main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-area monthly-page">

          <!-- 页签：碳排放 / 碳交易 -->
          <div class="monthly-tabs" role="tablist">
            <button type="button" class="monthly-tab is-active" id="tab-emission" role="tab" aria-selected="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg>
              碳排放
            </button>
            <button type="button" class="monthly-tab" id="tab-trade" role="tab" aria-selected="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2" fill="#fff"/><circle cx="15" cy="12" r="2" fill="#fff"/><circle cx="10" cy="18" r="2" fill="#fff"/></svg>
              碳交易
            </button>
          </div>

          <!-- 查询条件 -->
          <div class="report-filter">
            <div class="report-filter-row">
              <label class="report-field">
                <span>年度</span>
                <select id="monthly-year"></select>
              </label>
              <div class="report-filter-actions">
                <button type="button" class="btn btn-primary" id="btn-monthly-search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  查询
                </button>
                <button type="button" class="btn" id="btn-monthly-reset">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                  重置
                </button>
              </div>
            </div>
          </div>

          <!-- 12 张月份卡片 -->
          <div class="report-cards" id="monthly-cards"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../report/js/monthly.js"></script>
</body>
</html>
