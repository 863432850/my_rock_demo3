<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="../js/path-adapter.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碳排放异动分析 · 报告/报表管理</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    /* ===== 碳排放异动分析列表页（与双碳简报同款卡片样式） ===== */
    .report-page {
      background: #f5f7fb;
      padding: 0 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .report-filter {
      background: #fff;
      border: 1px solid #eef1f4;
      border-radius: 4px;
      padding: 14px 16px 10px;
    }

    .report-filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px 16px;
    }

    .report-field {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .report-field > span {
      font-size: 13px;
      color: #606266;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .report-field select {
      height: 30px;
      border: 1px solid #dcdfe6;
      border-radius: 3px;
      padding: 0 8px;
      font-size: 13px;
      color: #303133;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
      width: 150px;
    }

    .report-field select:focus { border-color: var(--primary); }

    .report-filter-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .report-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .report-card {
      background: #fff;
      border: 1px solid #9fd4ae;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-align: center;
      transition: box-shadow 0.18s, transform 0.18s, border-color 0.18s;
    }

    .report-card:hover {
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(46, 139, 87, 0.14);
      transform: translateY(-2px);
    }

    .report-card.is-disabled {
      border-color: #dcdfe6;
      background: #fafbfc;
      pointer-events: none;
    }

    .report-card.is-disabled .report-card-month,
    .report-card.is-disabled .report-card-range { color: #c0c4cc; }
    .report-card.is-disabled .report-card-head { background: #f2f3f5; }
    .report-card.is-disabled .report-card-foot .report-link { color: #c0c4cc; }

    .report-card-head {
      background: #e9f7ee;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    .report-card-body {
      padding: 14px 12px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .report-card-month {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
    }

    .report-card-range {
      font-size: 11.5px;
      color: #98a1ab;
      letter-spacing: 0.2px;
    }

    .report-card-foot {
      padding: 6px 12px 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .report-link {
      border: none;
      background: none;
      padding: 2px 6px;
      font-size: 13px;
      color: var(--primary);
      cursor: pointer;
      white-space: nowrap;
    }

    .report-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>
    <div class="app-body">
      <aside class="app-sidebar">
        <nav class="sidebar-menu" id="sidebar-menu"></nav>
      </aside>
      <main class="app-main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-area report-page">
          <div class="report-filter">
            <div class="report-filter-row">
              <label class="report-field">
                <span>年度</span>
                <select id="report-year">
                  <option value="2026" selected>2026</option>
                </select>
              </label>
              <div class="report-filter-actions">
                <button type="button" class="btn btn-primary" id="btn-report-search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  查询
                </button>
                <button type="button" class="btn" id="btn-report-reset">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                  重置
                </button>
              </div>
            </div>
          </div>

          <div class="report-cards" id="report-cards"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../report/js/anomaly.js"></script>
</body>
</html>
