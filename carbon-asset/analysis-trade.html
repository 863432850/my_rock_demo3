<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碳资产交易分析 · 碳资产管理</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/carbon-asset/css/analysis.css" />
  <style>
    .t-legend { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .t-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>
    <div class="app-body">
      <aside class="app-sidebar">
        <nav class="sidebar-menu" id="sidebar-menu"></nav>
      </aside>
      <main class="app-main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-area ca-page">

          <!-- 顶部指标卡 -->
          <div class="ca-kpis">
            <div class="ca-kpi">
              <div class="ca-kpi-head">
                <span class="ca-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg></span>
                <span class="ca-kpi-label">交易总笔数</span>
              </div>
              <div class="ca-kpi-value" id="k-count">--<span class="unit">笔</span></div>
              <div class="ca-kpi-sub">买入 + 卖出</div>
            </div>

            <div class="ca-kpi c-blue">
              <div class="ca-kpi-head">
                <span class="ca-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M8 10h8"/></svg></span>
                <span class="ca-kpi-label">成交总量</span>
              </div>
              <div class="ca-kpi-value" id="k-vol">--<span class="unit">tCO₂</span></div>
              <div class="ca-kpi-sub" id="k-vol-sub">--</div>
            </div>

            <div class="ca-kpi c-orange">
              <div class="ca-kpi-head">
                <span class="ca-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></span>
                <span class="ca-kpi-label">成交总额</span>
              </div>
              <div class="ca-kpi-value" id="k-amount">--<span class="unit">元</span></div>
              <div class="ca-kpi-sub" id="k-amount-sub">--</div>
            </div>

            <div class="ca-kpi c-red">
              <div class="ca-kpi-head">
                <span class="ca-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
                <span class="ca-kpi-label">成交均价</span>
              </div>
              <div class="ca-kpi-value" id="k-price">--<span class="unit">元/t</span></div>
              <div class="ca-kpi-sub" id="k-price-sub">--</div>
            </div>
          </div>

          <!-- 筛选栏 -->
          <div class="ca-filter">
            <label class="ca-field">
              <span>碳市场</span>
              <select id="t-market"></select>
            </label>
            <label class="ca-field">
              <span>买卖方向</span>
              <select id="t-dir"></select>
            </label>
            <label class="ca-field">
              <span>资产类型</span>
              <select id="t-type"></select>
            </label>
            <label class="ca-field">
              <span>交易时间</span>
              <span class="ca-field-range">
                <input type="month" id="t-start" />
                <em>至</em>
                <input type="month" id="t-end" />
              </span>
            </label>
            <div class="ca-filter-actions">
              <button type="button" class="ca-btn ca-btn-primary" id="t-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                查询
              </button>
              <button type="button" class="ca-btn" id="t-reset">重置</button>
            </div>
          </div>

          <!-- 统计粒度 -->
          <div class="ca-grain-head">
            <div class="ca-grain">
              <span class="ca-grain-title">统计粒度</span>
              <button type="button" class="ca-grain-tab active" data-grain="month">按月</button>
              <button type="button" class="ca-grain-tab" data-grain="quarter">按季</button>
            </div>
            <div class="ca-card-hint">支持趋势 / 均值 / 极值 / 同比 / 构成 / 分布多维分析 · 点击折线点查看数值</div>
          </div>

          <!-- 趋势 + 极值 -->
          <div class="ca-grid">
            <div class="ca-card col-span-2">
              <div class="ca-card-head">
                <div class="ca-card-title">成交量额趋势（含均值线）</div>
                <div class="t-legend"><i style="background:#00a854;"></i>成交量<i style="background:#1890ff;"></i>成交额(万元)<i style="background:#909399;height:2px;border-radius:1px;"></i>均值</div>
              </div>
              <div id="t-trend-chart"></div>
              <div class="ca-insights" id="t-trend-insights" style="margin-top:12px;"></div>
            </div>

            <!-- 同比 -->
            <div class="ca-card">
              <div class="ca-card-head">
                <div class="ca-card-title">成交量同比</div>
                <div class="ca-card-hint">本期 vs 上年同期</div>
              </div>
              <div id="t-yoy-chart"></div>
            </div>

            <!-- 构成 -->
            <div class="ca-card">
              <div class="ca-card-head">
                <div class="ca-card-title">成交量构成</div>
                <div class="ca-card-hint">按碳市场占比</div>
              </div>
              <div id="t-mix-chart"></div>
            </div>

            <!-- 分布 -->
            <div class="ca-card">
              <div class="ca-card-head">
                <div class="ca-card-title">各碳市场成交量分布</div>
                <div class="ca-card-hint">横向条形</div>
              </div>
              <div id="t-dist-chart"></div>
            </div>

            <!-- 买卖方向构成 -->
            <div class="ca-card">
              <div class="ca-card-head">
                <div class="ca-card-title">买卖方向构成</div>
                <div class="ca-card-hint">买入 / 卖出占比</div>
              </div>
              <div id="t-dir-chart"></div>
            </div>
          </div>

          <!-- 极值台账 -->
          <div class="ca-card" style="grid-column:span 2;">
            <div class="ca-card-head">
              <div class="ca-card-title">成交量极值台账</div>
              <div class="ca-card-hint">区间内峰值 / 谷值明细</div>
            </div>
            <div class="ca-table-wrap">
              <table class="ca-table">
                <thead>
                  <tr>
                    <th>统计期</th>
                    <th>碳市场</th>
                    <th>方向</th>
                    <th class="is-num">成交量(tCO₂)</th>
                    <th class="is-num">成交额(元)</th>
                    <th class="is-num">均价(元/t)</th>
                    <th>类型</th>
                  </tr>
                </thead>
                <tbody id="t-extreme-body"></tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/carbon-asset/js/charts.js"></script>
  <script src="/carbon-asset/js/analysis-trade.js"></script>
</body>
</html>
