<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="../js/path-adapter.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碳资产登记分析 · 碳资产管理</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="carbon-asset/css/analysis.css" />
  <style>
    /* 登记分析页局部样式 */
    .r-legend { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .r-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>
    <div class="app-body">
      <aside class="app-sidebar">
        <nav class="sidebar-menu" id="sidebar-menu"></nav>
      </aside>
      <main class="app-main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-area ca-page">

          <!-- 顶部指标卡 -->
          <div class="ca-kpis">
            <div class="ca-kpi">
              <div class="ca-kpi-head">
                <span class="ca-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h10M7 14h6"/></svg></span>
                <span class="ca-kpi-label">登记总笔数</span>
              </div>
              <div class="ca-kpi-value" id="k-registers">--<span class="unit">笔</span></div>
              <div class="ca-kpi-sub">覆盖全部碳市场</div>
            </div>

            <div class="ca-kpi c-blue">
              <div class="ca-kpi-head">
                <span class="ca-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 8l7 4 7-4M5 16l7-4 7 4"/></svg></span>
                <span class="ca-kpi-label">登记总量</span>
              </div>
              <div class="ca-kpi-value" id="k-amount">--<span class="unit">tCO₂</span></div>
              <div class="ca-kpi-sub" id="k-amount-sub">--</div>
            </div>

            <div class="ca-kpi c-orange">
              <div class="ca-kpi-head">
                <span class="ca-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
                <span class="ca-kpi-label">登记完成率</span>
              </div>
              <div class="ca-kpi-value" id="k-rate">--</div>
              <div class="ca-kpi-sub">审核通过 / 提交</div>
            </div>

            <div class="ca-kpi c-red">
              <div class="ca-kpi-head">
                <span class="ca-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 6-8"/><path d="M15 9h3v3"/></svg></span>
                <span class="ca-kpi-label">月均登记量</span>
              </div>
              <div class="ca-kpi-value" id="k-avg">--<span class="unit">tCO₂/月</span></div>
              <div class="ca-kpi-sub">按查询区间测算</div>
            </div>
          </div>

          <!-- 筛选栏 -->
          <div class="ca-filter">
            <label class="ca-field">
              <span>碳市场</span>
              <select id="r-market"></select>
            </label>
            <label class="ca-field">
              <span>资产类型</span>
              <select id="r-type"></select>
            </label>
            <label class="ca-field">
              <span>登记状态</span>
              <select id="r-status"></select>
            </label>
            <label class="ca-field">
              <span>登记时间</span>
              <span class="ca-field-range">
                <input type="month" id="r-start" />
                <em>至</em>
                <input type="month" id="r-end" />
              </span>
            </label>
            <div class="ca-filter-actions">
              <button type="button" class="ca-btn ca-btn-primary" id="r-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                查询
              </button>
              <button type="button" class="ca-btn" id="r-reset">重置</button>
            </div>
          </div>

          <!-- 统计粒度 + 提示 -->
          <div class="ca-grain-head">
            <div class="ca-grain">
              <span class="ca-grain-title">统计粒度</span>
              <button type="button" class="ca-grain-tab active" data-grain="month">按月</button>
              <button type="button" class="ca-grain-tab" data-grain="quarter">按季</button>
            </div>
            <div class="ca-card-hint">支持趋势 / 均值 / 极值 / 同比 / 构成多维分析 · 点击折线点查看数值</div>
          </div>

          <!-- 趋势 + 极值 -->
          <div class="ca-grid">
            <div class="ca-card col-span-2">
              <div class="ca-card-head">
                <div class="ca-card-title">登记趋势（含均值线）</div>
                <div class="r-legend"><i style="background:#00a854;"></i>本期登记量<i style="background:#909399;height:2px;border-radius:1px;"></i>均值线</div>
              </div>
              <div id="r-trend-chart"></div>
              <div class="ca-insights" id="r-trend-insights" style="margin-top:12px;"></div>
            </div>

            <!-- 同比 -->
            <div class="ca-card">
              <div class="ca-card-head">
                <div class="ca-card-title">登记量同比</div>
                <div class="ca-card-hint">本期 vs 上年同期</div>
              </div>
              <div id="r-yoy-chart"></div>
            </div>

            <!-- 构成 -->
            <div class="ca-card">
              <div class="ca-card-head">
                <div class="ca-card-title">登记量构成</div>
                <div class="ca-card-hint">按碳市场占比</div>
              </div>
              <div id="r-mix-chart"></div>
            </div>

            <!-- 分布 -->
            <div class="ca-card col-span-2">
              <div class="ca-card-head">
                <div class="ca-card-title">各碳市场登记分布</div>
                <div class="ca-card-hint">横向条形 · 数值单位 tCO₂</div>
              </div>
              <div id="r-dist-chart"></div>
            </div>
          </div>

          <!-- 明细台账 -->
          <div class="ca-card col-span-2" style="grid-column:span 2;">
            <div class="ca-card-head">
              <div class="ca-card-title">登记明细台账</div>
              <div class="ca-card-hint">维度明细 · 支持导出</div>
            </div>
            <div class="ca-table-wrap">
              <table class="ca-table">
                <thead>
                  <tr>
                    <th>统计时间</th>
                    <th>碳市场</th>
                    <th>资产类型</th>
                    <th>登记笔数</th>
                    <th class="is-num">登记量(tCO₂)</th>
                    <th class="is-num">同比(%)</th>
                    <th>状态</th>
                  </tr>
                </thead>
                <tbody id="r-table-body"></tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="carbon-asset/js/charts.js"></script>
  <script src="carbon-asset/js/analysis-register.js"></script>
</body>
</html>
