<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="../js/path-adapter.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碳资产冻结管理 · 碳资产管理</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    /* ===== 企业碳资产冻结管理 v2 ===== */
    .av-page {
      background: #f5f7fb;
      padding: 0 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 顶部汇总卡片 */
    .av-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .av-stat {
      position: relative;
      overflow: hidden;
      background: #fff;
      border: 1px solid #eef1f4;
      border-radius: 8px;
      padding: 18px 20px 18px;
      box-shadow: 0 2px 8px rgba(31, 56, 88, 0.03);
    }

    .av-stat::after {
      content: "";
      position: absolute;
      right: -18px;
      top: -18px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: var(--primary-light);
      opacity: 0.55;
    }

    .av-stat.is-frozen::after { background: #fff1e6; }
    .av-stat.is-used::after { background: #e6f4ff; }

    .av-stat-head {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .av-stat-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-light);
      color: var(--primary);
    }

    .av-stat.is-frozen .av-stat-icon { background: #fff1e6; color: var(--warning); }
    .av-stat.is-used .av-stat-icon { background: #e6f4ff; color: var(--info); }

    .av-stat-icon svg { width: 19px; height: 19px; }

    .av-stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .av-live {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--primary);
      font-weight: 500;
    }

    .av-live .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 0 rgba(0, 168, 84, 0.5);
      animation: avPulse 1.8s infinite;
    }

    @keyframes avPulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 168, 84, 0.45); }
      70% { box-shadow: 0 0 0 7px rgba(0, 168, 84, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 168, 84, 0); }
    }

    .av-stat-value {
      margin-top: 12px;
      font-size: 30px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      position: relative;
      z-index: 1;
      font-variant-numeric: tabular-nums;
    }

    .av-stat.is-frozen .av-stat-value { color: var(--warning); }
    .av-stat.is-used .av-stat-value { color: var(--info); }

    .av-stat-value .unit {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .av-stat-sub {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
      position: relative;
      z-index: 1;
    }

    /* 工具条（标题 + 说明） */
    .av-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .av-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .av-panel-title::before {
      content: "";
      width: 3px;
      height: 15px;
      border-radius: 2px;
      background: var(--primary);
    }

    .av-panel-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 资产列表 */
    .av-card {
      background: #fff;
      border: 1px solid #eef1f4;
      border-radius: 8px;
      overflow: hidden;
    }

    .av-table-wrap { overflow-x: auto; }

    .av-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 860px;
    }

    .av-table thead th {
      background: #eef8f2;
      color: var(--text-secondary);
      font-weight: 600;
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #e3f0e8;
      white-space: nowrap;
    }

    .av-table tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid #f0f0f0;
      color: var(--text);
      vertical-align: middle;
    }

    .av-table tbody tr:hover td { background: #f7fbf8; }
    .av-table tbody tr:last-child td { border-bottom: none; }

    .av-asset-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .av-asset-badge {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--primary-light);
      color: var(--primary);
    }

    .av-asset-badge svg { width: 20px; height: 20px; }

    .av-asset-name {
      font-weight: 600;
      color: var(--text);
    }

    .av-asset-cycle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .av-num { font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* 状态标签 */
    .av-tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .av-tag.avail { background: #e8f8ee; color: var(--primary-dark); }
    .av-tag.partial { background: #fff7e6; color: #d48806; }
    .av-tag.frozen { background: #fff1f0; color: var(--danger); }

    .av-tag .tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      margin-right: 5px;
    }

    /* 操作按钮 */
    .av-ops { white-space: nowrap; }

    .av-btn {
      height: 30px;
      padding: 0 13px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      transition: all 0.15s;
      margin-right: 8px;
    }

    .av-btn svg { width: 13px; height: 13px; }

    .av-btn:last-child { margin-right: 0; }

    .av-btn-frozen {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .av-btn-frozen:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .av-btn-frozen:disabled {
      background: #d9d9d9;
      border-color: #d9d9d9;
      color: #fff;
      cursor: not-allowed;
    }

    .av-btn-detail {
      color: var(--primary);
      border-color: #d6efe2;
      background: #f4fbf7;
    }

    .av-btn-detail:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .av-btn-unfreeze {
      color: var(--warning);
      border-color: #ffd9a8;
      background: #fff7eb;
    }

    .av-btn-unfreeze:hover {
      background: #fff1e0;
      border-color: var(--warning);
      color: #d48806;
    }

    .av-btn-unfreeze:disabled {
      color: #c0c4cc;
      border-color: #eef1f4;
      background: #f5f7fa;
      cursor: not-allowed;
    }

    .av-empty {
      text-align: center;
      padding: 48px 0;
      color: var(--text-muted);
    }

    /* ===== 冻结弹窗 ===== */
    .av-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .av-modal.show { display: flex; }

    .av-dialog {
      width: 560px;
      max-width: 92vw;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      animation: avPop 0.18s ease;
    }

    @keyframes avPop {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    .av-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .av-dialog-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .av-dialog-close {
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
    }

    .av-dialog-close:hover { color: var(--text); }

    .av-dialog-body { padding: 20px; }

    /* 资产信息条 */
    .av-asset-banner {
      background: #f7fbf8;
      border: 1px solid #e3f0e8;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .av-banner-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .av-asset-banner.is-unfreeze {
      background: #fff8f0;
      border-color: #ffe0b8;
    }

    .av-asset-banner.is-unfreeze .av-avail-value { color: var(--warning); }

    .av-banner-cycle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 可用余额（可实时变动） */
    .av-avail-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .av-avail-label {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .av-avail-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .av-avail-value .unit { font-size: 12px; color: var(--text-muted); margin-left: 4px; }

    /* 表单行 */
    .av-form-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .av-form-label {
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
    }

    .av-form-label .req { color: var(--danger); margin-right: 2px; }

    .av-form-label .opt { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }

    .av-qty-field {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 40px;
    }

    .av-qty-field button {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f5f7fa;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .av-qty-field button:hover { color: var(--primary); border-color: var(--primary); }

    /* 解冻数量步进容器（橙色语义） */
    .av-qty-field.is-unfreeze button {
      color: var(--warning);
    }

    .av-qty-field.is-unfreeze button:hover {
      color: #d48806;
      border-color: var(--warning);
    }

    .av-qty-field input {
      flex: 1;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      outline: none;
      min-width: 0;
      font-variant-numeric: tabular-nums;
    }

    .av-qty-field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0, 168, 84, 0.12);
    }

    .av-reason-input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .av-reason-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0, 168, 84, 0.12);
    }

    /* 冻结后预览条 */
    .av-preview {
      margin-top: 6px;
      background: #f0f9f4;
      border: 1px dashed #c3ead3;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .av-preview.waiting {
      background: #fafbfc;
      border-color: #e8ecf0;
    }

    .av-preview-label { font-size: 12px; color: var(--text-secondary); }

    .av-preview-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-dark);
      font-variant-numeric: tabular-nums;
    }

    .av-preview-value .unit { font-size: 11px; color: var(--text-muted); font-weight: 400; margin-left: 3px; }

    /* 解冻预览条（橙色系） */
    .av-preview.unfreeze {
      background: #fff8f0;
      border-color: #ffe0b8;
    }

    .av-preview.unfreeze .av-preview-value { color: var(--warning); }

    .av-preview.unfreeze.waiting {
      background: #fafbfc;
      border-color: #e8ecf0;
    }

    .av-dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid #f0f0f0;
    }

    .av-dialog-footer .av-modal-btn {
      height: 36px;
      padding: 0 20px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      transition: all 0.15s;
    }

    .av-dialog-footer .av-modal-btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .av-dialog-footer .av-modal-btn-primary:hover {
      background: var(--primary-dark);
    }

    /* ===== 明细弹窗 ===== */
    .av-detail-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .av-detail-item {
      border: 1px solid #eef1f4;
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .av-detail-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .av-detail-num {
      min-width: 34px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 600;
    }

    .av-detail-num-freeze { background: #fff1f0; color: var(--danger); }
    .av-detail-num-unfreeze { background: #fff7e6; color: #d48806; }

    .av-detail-qty { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

    .av-detail-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .av-detail-reason { font-size: 13px; color: var(--text-secondary); }

    .av-detail-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>
    <div class="app-body">
      <aside class="app-sidebar">
        <nav class="sidebar-menu" id="sidebar-menu"></nav>
      </aside>
      <main class="app-main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-area av-page">

          <!-- 顶部汇总卡片 -->
          <div class="av-summary">
            <div class="av-stat">
              <div class="av-stat-head">
                <span class="av-stat-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h10M7 14h6"/></svg>
                </span>
                <span class="av-stat-label">总持有量</span>
              </div>
              <div class="av-stat-value" id="sum-total">--<span class="unit">tCO₂</span></div>
              <div class="av-stat-sub">最新资产总量</div>
            </div>

            <div class="av-stat is-frozen">
              <div class="av-stat-head">
                <span class="av-stat-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 8l7 4 7-4M5 16l7-4 7 4"/></svg>
                </span>
                <span class="av-stat-label">总已冻结量</span>
              </div>
              <div class="av-stat-value" id="sum-frozen">--<span class="unit">tCO₂</span></div>
              <div class="av-stat-sub">已冻结暂不可用</div>
            </div>

            <div class="av-stat is-used">
              <div class="av-stat-head">
                <span class="av-stat-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                </span>
                <span class="av-stat-label">总可用量</span>
              </div>
              <div class="av-stat-value" id="sum-usable">--<span class="unit">tCO₂</span></div>
              <div class="av-stat-sub" id="sum-usable-sub">随冻结操作实时变动</div>
            </div>
          </div>

          <!-- 资产列表 -->
          <div class="av-panel-head">
            <div class="av-panel-title">资产列表</div>
            <div class="av-panel-hint">按【碳市场】汇总 · 可用余额 = 总持有量 − 已冻结量</div>
          </div>

          <div class="av-card">
            <div class="av-table-wrap">
              <table class="av-table">
                <thead>
                  <tr>
                    <th>资产信息</th>
                    <th style="text-align:right;">总持有量(tCO₂)</th>
                    <th style="text-align:right;">可用余额(tCO₂)</th>
                    <th style="text-align:right;">已冻结量(tCO₂)</th>
                    <th>状态</th>
                    <th style="width:240px;">操作</th>
                  </tr>
                </thead>
                <tbody id="av-list-body"></tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- 冻结操作弹窗 -->
  <div class="av-modal" id="av-freeze-modal">
    <div class="av-dialog">
      <div class="av-dialog-header">
        <div class="av-dialog-title">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#00a854" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          冻结资产
        </div>
        <button type="button" class="av-dialog-close" data-close="freeze">×</button>
      </div>
      <div class="av-dialog-body">
        <div class="av-asset-banner">
          <div>
            <div class="av-banner-name" id="afz-name">--</div>
            <div class="av-banner-cycle" id="afz-cycle">--</div>
          </div>
          <div class="av-avail-box">
            <span class="av-avail-label">
              当前可用余额
            </span>
            <span class="av-avail-value" id="afz-available">--<span class="unit">tCO₂</span></span>
          </div>
        </div>

        <div class="av-form-row">
          <span class="av-form-label"><i class="req">*</i>冻结数量</span>
          <div class="av-qty-field">
            <button type="button" data-step="minus">−</button>
            <input type="text" id="afz-qty" value="0" />
            <button type="button" data-step="plus">＋</button>
          </div>
        </div>

        <div class="av-form-row">
          <span class="av-form-label"><i class="req">*</i>冻结原因</span>
          <input type="text" class="av-reason-input" id="afz-reason" placeholder="请输入冻结原因（必填）" />
        </div>

        <div class="av-preview waiting" id="afz-preview">
          <span class="av-preview-label">冻结后可用余额</span>
          <span class="av-preview-value" id="afz-after">--<span class="unit">tCO₂</span></span>
        </div>
      </div>
      <div class="av-dialog-footer">
        <button type="button" class="av-modal-btn" data-close="freeze">取消</button>
        <button type="button" class="av-modal-btn av-modal-btn-primary" data-ok="freeze">确认冻结</button>
      </div>
    </div>
  </div>

  <!-- 解冻操作弹窗 -->
  <div class="av-modal" id="av-unfreeze-modal">
    <div class="av-dialog">
      <div class="av-dialog-header">
        <div class="av-dialog-title">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fa8c16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.7-1.5"/></svg>
          解冻资产
        </div>
        <button type="button" class="av-dialog-close" data-close="unfreeze">×</button>
      </div>
      <div class="av-dialog-body">
        <div class="av-asset-banner is-unfreeze">
          <div>
            <div class="av-banner-name" id="auf-name">--</div>
            <div class="av-banner-cycle" id="auf-cycle">--</div>
          </div>
          <div class="av-avail-box">
            <span class="av-avail-label" id="auf-frozen-label">当前已冻结量</span>
            <span class="av-avail-value" id="auf-frozen">--<span class="unit">tCO₂</span></span>
          </div>
        </div>

        <div class="av-form-row">
          <span class="av-form-label"><i class="req">*</i>解冻数量</span>
          <div class="av-qty-field is-unfreeze">
            <button type="button" data-step="minus" data-un="1">−</button>
            <input type="text" id="auf-qty" value="0" />
            <button type="button" data-step="plus" data-un="1">＋</button>
          </div>
        </div>

        <div class="av-form-row">
          <span class="av-form-label"><i class="req">*</i>解冻原因</span>
          <input type="text" class="av-reason-input" id="auf-reason" placeholder="请输入解冻原因（必填）" />
        </div>

        <div class="av-preview unfreeze waiting" id="auf-preview">
          <span class="av-preview-label">解冻后可用余额</span>
          <span class="av-preview-value" id="auf-after">--<span class="unit">tCO₂</span></span>
        </div>
      </div>
      <div class="av-dialog-footer">
        <button type="button" class="av-modal-btn" data-close="unfreeze">取消</button>
        <button type="button" class="av-modal-btn av-modal-btn-primary" data-ok="unfreeze">确认解冻</button>
      </div>
    </div>
  </div>

  <!-- 查看明细弹窗 -->
  <div class="av-modal" id="av-detail-modal">
    <div class="av-dialog">
      <div class="av-dialog-header">
        <div class="av-dialog-title" id="detail-title">冻结明细</div>
        <button type="button" class="av-dialog-close" data-close="detail">×</button>
      </div>
      <div class="av-dialog-body">
        <div class="av-detail-list" id="detail-list"></div>
      </div>
      <div class="av-dialog-footer">
        <button type="button" class="av-modal-btn" data-close="detail">关闭</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../carbon-asset/js/freeze.js"></script>
</body>
</html>
