<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="../js/path-adapter.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下级目标制定情况 · 碳目标管理</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>
    <div class="app-body">
      <aside class="app-sidebar">
        <nav class="sidebar-menu" id="sidebar-menu"></nav>
      </aside>
      <main class="app-main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-area">
          <div class="sub-page-head">
            <button type="button" class="back-btn" id="btn-back" title="返回">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="sub-page-title">下级目标制定情况</span>
          </div>

          <div class="filter-bar">
            <div class="filter-left">
              <div class="filter-item">
                <label>简称</label>
                <input id="filter-short-name" type="text" placeholder="请输入" />
              </div>
              <div class="filter-actions">
                <button type="button" class="btn btn-primary" id="btn-search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  查询
                </button>
                <button type="button" class="btn" id="btn-reset">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                  重置
                </button>
              </div>
            </div>
            <button type="button" class="btn btn-primary btn-add" id="btn-urge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
              催办
            </button>
          </div>

          <div class="status-tabs" id="status-tabs"></div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>序号</th>
                  <th>简称</th>
                  <th>全称</th>
                  <th>状态</th>
                  <th>提交时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../carbon/js/carbon-biz.js"></script>
  <script>initSubordinatePage();</script>
</body>
</html>
