<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="../js/path-adapter.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碳目标制定 · 碳目标管理</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>
    <div class="app-body">
      <aside class="app-sidebar">
        <nav class="sidebar-menu" id="sidebar-menu"></nav>
      </aside>
      <main class="app-main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-area">
          <div class="filter-bar">
            <div class="filter-left">
              <div class="filter-item">
                <label>目标时间范围</label>
                <div class="range-pair">
                  <select id="filter-start" class="year-select"></select>
                  <span class="tilde">~</span>
                  <select id="filter-end" class="year-select"></select>
                </div>
              </div>
              <div class="filter-item">
                <label>碳目标名称</label>
                <input id="filter-name" type="text" placeholder="请输入" />
              </div>
              <div class="filter-item">
                <label>碳目标编制状态</label>
                <select id="filter-status">
                  <option value="">请选择</option>
                  <option value="draft">编制中</option>
                  <option value="pending">待审核</option>
                  <option value="passed">已通过</option>
                  <option value="rejected">已驳回</option>
                </select>
              </div>
              <div class="filter-actions">
                <button type="button" class="btn btn-primary" id="btn-search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  查询
                </button>
                <button type="button" class="btn" id="btn-reset">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                  重置
                </button>
              </div>
            </div>
            <button type="button" class="btn btn-primary btn-add" id="btn-add">+ 新增碳目标</button>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>序号</th>
                  <th>碳目标名称</th>
                  <th>目标时间维度</th>
                  <th>目标时间范围</th>
                  <th>是否分解到下级</th>
                  <th>碳目标编制状态</th>
                  <th>下级目标制定情况</th>
                  <th>下级是否分解</th>
                  <th>更新时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../carbon/js/carbon-biz.js"></script>
  <script>initCreatePage();</script>
</body>
</html>
