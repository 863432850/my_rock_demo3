<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碳目标分解详情 · 碳目标管理</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="wizard-page" data-page="decompose-edit">
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>
    <div class="app-body">
      <aside class="app-sidebar">
        <nav class="sidebar-menu" id="sidebar-menu"></nav>
      </aside>
      <main class="app-main">
        <div class="content-area">
          <div class="wizard-head view-head">
            <div class="wizard-title">
              <button type="button" class="back-btn" id="btn-back" title="返回">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <span id="page-title">碳目标分解详情</span>
            </div>
          </div>

          <div class="wizard-body">
            <div class="section-card">
              <div class="view-section-head" data-collapse>
                <span class="view-mark">/</span>
                <span>基本信息</span>
                <button type="button" class="collapse-toggle" tabindex="-1">▾</button>
              </div>
              <div class="view-section-body">
                <div class="readonly-grid">
                  <div class="ro-item">
                    <div class="ro-label">碳目标名称</div>
                    <div class="ro-value" id="ro-name">--</div>
                  </div>
                  <div class="ro-item">
                    <div class="ro-label">目标时间维度</div>
                    <div class="ro-value" id="ro-dimension">--</div>
                  </div>
                  <div class="ro-item">
                    <div class="ro-label">目标年份</div>
                    <div class="ro-value" id="ro-year">--</div>
                  </div>
                </div>
                <div class="attach-row">
                  <span class="lbl">附件</span>
                  <span class="attach-hint">请最多上传五个不超过100MB的文件，支持 pdf、doc、docx、xlsx、xls 格式</span>
                  <div class="file-list" id="ro-files"></div>
                </div>
              </div>
            </div>

            <div class="section-card">
              <div class="view-section-head" data-collapse>
                <span class="view-mark">/</span>
                <span>指标配置</span>
                <button type="button" class="collapse-toggle" tabindex="-1">▾</button>
              </div>
              <div class="view-section-body">
                <div class="table-wrap">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th>序号</th>
                        <th>指标名称</th>
                        <th>单位</th>
                      </tr>
                    </thead>
                    <tbody id="indicator-tbody"></tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="section-card">
              <div class="view-section-head" data-collapse>
                <span class="view-mark">/</span>
                <span>碳目标分解</span>
                <button type="button" class="collapse-toggle" tabindex="-1">▾</button>
              </div>
              <div class="view-section-body">
                <div class="decompose-toolbar">
                  <div class="indicator-tabs" id="indicator-tabs"></div>
                  <button type="button" class="btn btn-primary hidden" id="btn-avg">全年平均分配</button>
                </div>
                <div class="table-wrap decompose-table-wrap">
                  <table class="data-table tree-table decompose-table" id="decompose-table"></table>
                </div>
              </div>
            </div>
          </div>

          <div class="wizard-footer hidden" id="edit-footer">
            <button type="button" class="btn btn-soft" id="btn-save">保存</button>
            <button type="button" class="btn btn-primary btn-lg" id="btn-submit">提交审核</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="avg-confirm-modal">
    <div class="modal confirm-modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3>提示</h3>
        <button type="button" class="modal-close" id="btn-avg-close">×</button>
      </div>
      <div class="modal-body confirm-body">
        <div class="confirm-icon">!</div>
        <p>当前计划已进行数据填写，执行全年平均分解，会覆盖数据，是否继续操作？</p>
      </div>
      <div class="modal-footer confirm-footer">
        <button type="button" class="btn" id="btn-avg-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="btn-avg-confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/carbon/js/carbon-biz.js"></script>
  <script src="/carbon/js/create.js"></script>
  <script src="/carbon/js/decompose-edit.js"></script>
</body>
</html>
